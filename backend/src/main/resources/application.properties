spring.application.name=backend

# MongoDB: every POST /api/analyze persists the full Analysis document
# (request echo + claims/signals/evidence/explanation/actions/score) into
# the "analyses" collection BEFORE the response is built, and the Mongo
# document id is returned as analysisId. Set MONGODB_URI in the environment,
# e.g. mongodb://localhost:27017 ; database "satark" below.
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=satark

# Phase 1 (P3 foundation): AI pipeline master switch. Enabled by default —
# POST /api/analyze runs the deterministic P3 pipeline. Set false to
# restore the legacy mock path (kept as fallback).
satark.ai.enabled=true
satark.ai.provider=groq
satark.ai.model=openai/gpt-oss-20b
satark.ai.timeout=15s
satark.ai.max-input-chars=4000
# Phase 10 (P4): evidence layer. Enabled by default alongside P3;
# offline MVP — no network verification. Set false to restore mock evidence.
satark.evidence.enabled=true
satark.evidence.offline-mode=true